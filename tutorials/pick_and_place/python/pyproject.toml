[project]
name = "pick-and-place-python"
version = "0.1.0"
description = "Python side of the Unity <-> Python wiring for the pick-and-place RL controller"
requires-python = ">=3.10"
dependencies = [
    "gymnasium[box2d]>=1.3.0",
    "ikpy>=4.0.0",
    "matplotlib>=3.10.9",
    "numpy",
    "pygame>=2.6.1",
    "torch>=2.12.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
